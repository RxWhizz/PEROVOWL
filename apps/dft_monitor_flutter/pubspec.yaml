name: dft_monitor_flutter
description: Desktop Flutter shell for the local DFT monitor engine.
publish_to: "none"
version: 0.7.3+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  file_picker: ^10.3.0
  fl_chart: ^1.0.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.0
  vector_math: ^2.1.4
  web_socket_channel: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/engine/
