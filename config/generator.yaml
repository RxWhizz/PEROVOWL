# BUHO — Configuración del Generador de Candidatos ABX3
# Fase 1: Generación → Filtrado → Estructuras → DFT básico (r2SCAN)
#
# Uso:
#   python -m buho.generator generate  --config config/generator.yaml
#   python -m buho.generator filter    --config config/generator.yaml
#   python -m buho.generator build-structures --top 500
#   python -m buho.dft prepare-relax   --top 500
#   python -m buho.dft collect-results

version: "1.0.0"
random_seed: 42

# ── Espacio químico ────────────────────────────────────────────────────────────
chemical_space:
  A_sites: [Cs, MA, FA, Rb, K]
  B_sites: [Pb, Sn, Ge]
  X_sites: [I, Br, Cl]

# ── Generación ─────────────────────────────────────────────────────────────────
generation:
  # Fracciones discretas para mezclas de sitio (modo "discrete")
  fractions: [0.125, 0.25, 0.5, 0.75, 0.875]

  # ── Muestreo continuo por batches (active learning) ──────────────────────────
  # "discrete": enumera la grilla de `fractions` (comportamiento original).
  # "continuous": muestrea fracciones continuas (uniform/Dirichlet) → espacio
  #   infinito procesado en batches reproducibles (seed = random_seed + batch_id).
  fraction_mode: continuous
  n_samples_per_combo: 8       # fracciones continuas muestreadas por combinación de sitios
  batch_size: 1000            # candidatos únicos objetivo por batch (tras dedup)

  # Objetivos de candidatos
  n_candidates_raw: 5000       # target brutos (se genera todo lo que hay, sin límite duro)
  n_candidates_filtered: 2000  # target tras filtros (informativo)
  n_candidates_dft: 500        # seleccionados para DFT por score

  # Modos de generación activos
  modes:
    pure:        true   # 5A × 3B × 3X = 45 puros
    A_mixed:     true   # mezclas de 2 A-sites
    B_mixed:     true   # mezclas de 2 B-sites
    X_mixed:     true   # mezclas de 2 o 3 X-sites
    multi_mixed: false  # A+X mixtos simultáneos (más costoso)

# ── Filtros físicos ───────────────────────────────────────────────────────────
filters:
  goldschmidt:
    min: 0.80
    max: 1.10
  octahedral:
    min: 0.40
    max: 0.90
  volume_A3:        # volumen estimado por fórmula unitaria
    min: 50.0
    max: 2000.0

# ── Construcción de estructuras ───────────────────────────────────────────────
structure:
  supercell_pure:    [1, 1, 1]   # celda unitaria para composiciones puras
  supercell_mixed:   [2, 2, 2]   # supercelda 2×2×2 (40 átomos) para mezclas
  organic_A_placeholder: Cs      # catión de reemplazo para MA/FA en estructura
  export_formats: [cif, poscar, traj]

# ── DFT básico (PBE) ──────────────────────────────────────────────────────────
# Config validada en FASE 0 (2026-06-04): PBE Γ-only ecut300 = 37s/iter, converge.
# r2SCAN descartado para cribado: domain>1 crashea GPAW master → r2SCAN a 1-core
# es 195s/iter (~5 días para 482 superceldas). r2SCAN+U+SOC se aplica después a top.
dft_basic:
  xc: PBE              # GGA: rápido, estable, domain-independiente; energías comparables

  ecut: 300            # eV — cribado rápido (producción r2SCAN: 450)
  kpts: [2, 2, 2]      # celdas unidad; superceldas → Γ-only [1,1,1] automático
  smearing: 0.01       # FermiDirac width (eV) — Sn usa 0.2 internamente
  fmax: 0.05           # eV/Å — criterio FIRE (solo si max_steps>0)
  max_steps: 0         # 0 = SINGLE-POINT (cribado: etiqueta para generador, no optimizador).
                       # >0 = relajación FIRE (refinamiento de candidatos top).
  maxiter: 200         # iteraciones SCF máximas
  conv_density: 1.0e-3 # convergencia de densidad (cribado)
  soc: false           # SOC reservado para refinamiento de candidatos top

  # Legado (no usados con XC=PBE, mantenidos por compat de _write_input):
  sn_u_ev: 2.5
  kpt_rank_cap: 1

# ── Cribado por cascada (active learning por batches) ─────────────────────────
# Cada batch pasa tiers de costo creciente antes del DFT caro:
#   Tier 0 descriptores (instantáneo) → Tier 1 surrogate (ms) →
#   Tier 2 MLFF energía/estabilidad (seg) → Tier 3 DFT single-point (min).
screening:
  tier1_surrogate: true        # usar surrogate de bandgap (ventana PV) para rankear
  tier2_mlff: true             # MACE relax + MEGNet/M3GNet Eform (estabilidad)
  mlff_relax: false            # true = relajar con MACE antes de Eform (más caro); false = single-point
  eform_max_eV_atom: 0.20      # descartar si Eform > este umbral (proxy de inestable)

  # ── Torre de cribado ────────────────────────────────────────────────────────
  # Cada tier descarta y el siguiente solo evalúa lo que sobrevivió: ahí está el
  # ahorro, porque el Tier 2 cuesta ~0.5 s por candidato frente a ~2 ms del
  # Tier 1. Con los gates a false los tiers solo puntúan (comportamiento previo).
  tier1_gate: true             # el surrogate descarta fuera de la ventana PV
  tier2_gate: true             # el MLFF descarta por encima de eform_max

  # Holgura de la malla, en sigmas del propio modelo. El surrogate tiene
  # MAE ≈ 0.31 eV y la ventana PV mide 0.7 eV: cribar por la estimación puntual
  # tiraría materiales cuyo Eg real sí cae dentro. Con 0 la malla es dura.
  sigma_k: 1.0
  mace_model: "small"          # tamaño del modelo MACE-MP-0
  n_dft_per_batch: 0           # 0 = TODOS los que pasen estabilidad (Eform<=umbral); >0 = top-N
  registry_path: data/processed/candidate_registry.txt  # dedup persistente entre batches

# ── ML (Fase 2 — diferida) ────────────────────────────────────────────────────
ml_initial:
  test_size: 0.2
  cv_folds: 5
  n_bootstrap: 50

# ── Active learning (Fase 2 — diferida) ──────────────────────────────────────
acquisition:
  n_top: 100
  beta: 1.0
  pv_window: [1.1, 1.8]

# ── Descubrimiento autónomo ──────────────────────────────────────────────────
# Recorre el espacio químico finito con ML/cascada y manda a DFT solo la
# frontera viable. El conteo queda alrededor de decenas de miles de
# composiciones, según las cotas físicas activas.
discovery:
  output_dir: data/discovery
  dft_per_round: 30
  min_pv_score: 0.45
  frontier_size: 500
  pareto_input_size: 5000
  mlff_pool_size: 5000
  require_mlff_for_dft: true
  runner_slots: 5
  runner_cores: 8
  runner_stagger: 8
  runner_backend: auto       # auto: Windows usa WSL; Linux usa local
  runner_launcher: direct    # auto, conda o direct
  runner_preflight_timeout: 90
  runner_conda_env: gpaw246  # valor por defecto; se puede cambiar sin tocar codigo
  poll_interval_sec: 60
  # Si el runner DFT no escribe nada (STATUS, GPAW logs) en este tiempo, se le
  # da por muerto y el bucle lo relanza -- aunque queden jobs marcados
  # "running" con un PID que ya no existe.
  runner_stale_after_sec: 600
  # Relanzamientos consecutivos sin que progrese ningun job antes de rendirse
  # con estado "error" en vez de reintentar en bucle.
  max_stale_relaunches: 5
  max_per_b_family: 15
  max_per_halide: 18
  windows_mounts:
    - posix: /media/luis-ochoa/Nuevo vol
      windows: C:/NuevoVol
      wsl: /mnt/n
  # Tier 2 del cribado (MLFF/GNN). Entorno APARTE de gpaw246: GPAW esta fijado a
  # numpy 1.26 y matgl exige numpy>=2, asi que compartirlos rompe el DFT. Se
  # crea y se repara con `buho setup install mlff`.
  # ── Competencia de fases ───────────────────────────────────────────────────
  #
  # El pipeline construia siempre Pm-3m. Para CsPbI3 esa es la fase alfa, que
  # solo existe por encima de 330 C: a temperatura ambiente el material esta en
  # otra, y la cubica pierde por 124 meV/f.u. Con esto activo, antes de preparar
  # el DFT se generan las distorsiones de inclinacion, compiten en energia con
  # el potencial y va a calculo la ganadora --- reescalada al tamano de la
  # semilla, porque el potencial ordena bien pero infla el volumen un 4.6 %.
  #
  # Necesita el entorno MLFF. Sin el se prepara la cubica, igual que antes.
  fases:
    activo: true
    modelo_pes: M3GNet-PES-MatPES-PBE-2025.2
    fmax: 0.05              # eV/A, criterio de parada de la relajacion
    pasos: 300              # tope de pasos FIRE por fase
    supercelda_base: [2, 2, 2]
  mlff:
    backend: auto            # auto | local | wsl | off
    timeout: 900             # por llamada al worker, no por lote entero
    chunk_size: 2000         # candidatos por llamada; ~15 s de carga + 0.08 s/cand
    wsl:
      distro: Ubuntu
      env_name: perovowl-mlff
      micromamba: /home/luis/perovowl-micromamba/bin/micromamba
      python: /home/luis/perovowl-micromamba/envs/perovowl-mlff/bin/python
      project_root: /mnt/c/Users/LUIS/Documents/GitHub/PEROVOWL
  wsl:
    distro: Ubuntu
    driver_python: python3
    project_root: /mnt/c/Users/LUIS/Documents/GitHub/PEROVOWL
    python: /home/luis/perovowl-micromamba/envs/gpaw246/bin/python
    mpirun: /home/luis/perovowl-micromamba/envs/gpaw246/bin/mpiexec
    setup_path: /home/luis/perovowl-micromamba/envs/gpaw246/lib/python3.12/site-packages/gpaw_data/setups
    mounts:
      - windows: C:/NuevoVol
        wsl: /mnt/n
      - windows: C:/Users/LUIS/Documents/GitHub/PEROVOWL
        wsl: /mnt/c/Users/LUIS/Documents/GitHub/PEROVOWL
  space:
    fraction_step: 0.0073
    min_fraction: 0.05
    max_fraction: 0.95
    include_multi_mixed: false

# ── Rutas de salida ───────────────────────────────────────────────────────────
paths:
  raw_candidates:      data/raw/generated_candidates.jsonl
  filtered_candidates: data/processed/filtered_candidates.csv
  top_candidates:      data/processed/top500_candidates.csv
  relax_dir:           /media/luis-ochoa/Nuevo vol/dft/runs/relax_basic
  runs_batches_dir:    /media/luis-ochoa/Nuevo vol/dft/runs/batches
  results_csv:         data/processed/relax_basic_results.csv
  models_dir:          models/initial_predictors
  reports_dir:         reports
