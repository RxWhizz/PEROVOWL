# BUHO — Configuración del generador de candidatos ABX3 (VERSIÓN DISTRIBUIBLE)
#
# Este archivo es el que se empaqueta dentro del binario de escritorio. Es una
# copia de `config/generator.yaml` SIN las rutas concretas de la máquina de
# desarrollo (Python de WSL, mounts de disco externo, directorios de salida
# absolutos). Esas dependen de cada equipo y se configuran desde la app, en la
# pestaña **Entorno**, o con `buho setup`.
#
# Para personalizarlo sin recompilar: deja un `config/generator.yaml` propio en
# la raíz de datos del monitor (`Diagnóstico → raíz de datos`). El monitor lo
# prefiere sobre esta copia empaquetada.

version: "1.0.0"
random_seed: 42

# ── Espacio químico ────────────────────────────────────────────────────────────
chemical_space:
  A_sites: [Cs, MA, FA, Rb, K]
  B_sites: [Pb, Sn, Ge]
  X_sites: [I, Br, Cl]

# ── Generación ─────────────────────────────────────────────────────────────────
generation:
  fractions: [0.125, 0.25, 0.5, 0.75, 0.875]
  fraction_mode: continuous
  n_samples_per_combo: 8
  batch_size: 1000
  n_candidates_raw: 5000
  n_candidates_filtered: 2000
  n_candidates_dft: 500
  modes:
    pure:        true
    A_mixed:     true
    B_mixed:     true
    X_mixed:     true
    multi_mixed: false

# ── Filtros físicos ───────────────────────────────────────────────────────────
filters:
  goldschmidt:
    min: 0.80
    max: 1.10
  octahedral:
    min: 0.40
    max: 0.90
  volume_A3:
    min: 50.0
    max: 2000.0

# ── Construcción de estructuras ───────────────────────────────────────────────
structure:
  supercell_pure:    [1, 1, 1]
  supercell_mixed:   [2, 2, 2]
  organic_A_placeholder: Cs
  export_formats: [cif, poscar, traj]

# ── DFT básico (PBE) ──────────────────────────────────────────────────────────
dft_basic:
  xc: PBE
  ecut: 300
  kpts: [2, 2, 2]
  smearing: 0.01
  fmax: 0.05
  max_steps: 0
  maxiter: 200
  conv_density: 1.0e-3
  soc: false
  sn_u_ev: 2.5
  kpt_rank_cap: 1

# ── Cribado por cascada ──────────────────────────────────────────────────────
screening:
  tier1_surrogate: true
  tier2_mlff: true
  mlff_relax: false
  eform_max_eV_atom: 0.20
  tier1_gate: true
  tier2_gate: true
  sigma_k: 1.0
  mace_model: "small"
  n_dft_per_batch: 0
  registry_path: data/processed/candidate_registry.txt

# ── ML / adquisición ─────────────────────────────────────────────────────────
ml_initial:
  test_size: 0.2
  cv_folds: 5
  n_bootstrap: 50

acquisition:
  n_top: 100
  beta: 1.0
  pv_window: [1.1, 1.8]

# ── Descubrimiento autónomo ──────────────────────────────────────────────────
# Sin los bloques `wsl:`, `mlff.wsl:` ni `windows_mounts:`: esos apuntan a rutas
# de una máquina concreta. Se rellenan desde Entorno / `buho setup`. Sin ellos,
# el runtime intenta autodetección (variables de entorno, PATH) y, si no
# encuentra nada utilizable, el cribado sigue con los tiers 0/1 y lo dice.
discovery:
  output_dir: data/discovery
  dft_per_round: 30
  min_pv_score: 0.45
  frontier_size: 500
  pareto_input_size: 5000
  mlff_pool_size: 5000
  require_mlff_for_dft: true
  runner_slots: 5
  runner_cores: 8
  runner_stagger: 8
  runner_backend: auto
  runner_launcher: direct
  runner_preflight_timeout: 90
  runner_conda_env: gpaw246
  poll_interval_sec: 60
  runner_stale_after_sec: 600
  max_stale_relaunches: 5
  max_per_b_family: 15
  max_per_halide: 18
  # ── Competencia de fases ───────────────────────────────────────────────────
  #
  # El pipeline construia siempre Pm-3m. Para CsPbI3 esa es la fase alfa, que
  # solo existe por encima de 330 C: a temperatura ambiente el material esta en
  # otra, y la cubica pierde por 124 meV/f.u. Con esto activo, antes de preparar
  # el DFT se generan las distorsiones de inclinacion, compiten en energia con
  # el potencial y va a calculo la ganadora --- reescalada al tamano de la
  # semilla, porque el potencial ordena bien pero infla el volumen un 4.6 %.
  #
  # Necesita el entorno MLFF. Sin el se prepara la cubica, igual que antes.
  fases:
    activo: true
    modelo_pes: M3GNet-PES-MatPES-PBE-2025.2
    fmax: 0.05              # eV/A, criterio de parada de la relajacion
    pasos: 300              # tope de pasos FIRE por fase
    supercelda_base: [2, 2, 2]
  mlff:
    backend: auto
    timeout: 900
    chunk_size: 2000
  space:
    fraction_step: 0.0073
    min_fraction: 0.05
    max_fraction: 0.95
    include_multi_mixed: false

# ── Rutas de salida ─────────────────────────────────────────────────────────
# Relativas a la raíz de datos del monitor, no absolutas.
paths:
  raw_candidates:      data/raw/generated_candidates.jsonl
  filtered_candidates: data/processed/filtered_candidates.csv
  top_candidates:      data/processed/top500_candidates.csv
  relax_dir:           runs/relax_basic
  runs_batches_dir:    runs/batches
  results_csv:         data/processed/relax_basic_results.csv
  models_dir:          models/initial_predictors
  reports_dir:         reports
