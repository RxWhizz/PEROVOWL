[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buho"
dynamic = ["version"]
description = "Descubrimiento de perovskitas ABX3 fotovoltaicas: cribado en cascada, DFT con GPAW y aprendizaje activo"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "DFT-CsPbI3 Contributors" },
]
keywords = ["DFT", "GPAW", "perovskite", "CsPbI3", "ASE", "computational-chemistry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "perovskite-utils @ git+https://github.com/RxWhizz/perovskite-utils@v0.1.0",
    "gpaw>=24.1.0",
    "ase>=3.23.0",
    # Identifica el grupo espacial de una estructura RELAJADA, que es lo unico
    # que dice en que fase quedo el material. Sin el, `buho.structure.fases`
    # genera las candidatas pero no puede decir cual salio, y el pipeline
    # volveria a suponer que todo es cubico.
    "spglib>=2.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "click>=8.1",
    "scipy>=1.12",
    # Lo usan ml_surrogate y analytics; faltaba declararlo. Los modelos de
    # models/*.pkl se serializaron con 1.8.0: una versión distinta puede
    # fallar al despicklear (lo reporta GET /api/models).
    # Techo real, no solo en CI: los models/*.pkl se serializaron con 1.8 y
    # 1.9 no los despickliza. Sin el, un `pip install -e .` deja al usuario
    # sin ningun modelo y el fallo es silencioso.
    "scikit-learn>=1.8,<1.9",
    # Los secretos se leen de .env. Estaba llegando de rebote como dependencia
    # de otra cosa, y apoyarse en eso para algo de seguridad es frágil.
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "mypy"]
# Monitor web (src/monitor_api): estas dependencias se importaban sin estar
# declaradas, así que instalar el proyecto no instalaba su propia API.
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "psutil>=5.9",
    "itsdangerous>=2.1",   # firma de la cookie de sesión (SessionMiddleware)
]
desktop = [
    "pywebview>=5.0",
    "qtpy>=2.4",
    "PyQt6>=6.7",
    "PyQt6-WebEngine>=6.7",
]
# Tier 2 de la cascada de cribado (MLFF de estabilidad). Aparte porque pesa
# ~1.5 GB y no viaja en el binario: allí el tier se declara no disponible.
screening = [
    "torch>=2.2",
    "matgl>=4.0",
    "pymatgen>=2024.1",
]

[project.scripts]
buho = "buho.cli:main"
perovowl = "buho.cli:main"
dft-monitor = "monitor_api.launcher:main"
dft-run = "dft_cspbi3.cli:run_full_workflow"
dft-converge = "dft_cspbi3.cli:run_convergence_test"
dft-scissor = "dft_cspbi3.cli:apply_scissor"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
# Fuente única de la versión, compartida con la app, la API y el binario.
path = "src/monitor_api/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dft_cspbi3", "src/ml_surrogate", "src/buho", "src/monitor_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
