name: Release

# Los tags v* publican; workflow_dispatch permite ensayar el build completo sin
# crear ningún tag ni Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── La versión del código manda ─────────────────────────────────────────────
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.leer.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: leer
        shell: bash
        run: |
          VERSION="$(python3 -c "
          import re, pathlib
          texto = pathlib.Path('src/monitor_api/__init__.py').read_text()
          print(re.search(r'__version__ = \"([^\"]+)\"', texto).group(1))")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión del código: $VERSION"

          # Publicar un v0.3.0 que por dentro se llama 0.2.0 sería confuso para
          # siempre: mejor abortar aquí.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::El tag v$TAG no coincide con __version__ = $VERSION"
              exit 1
            fi
          fi

  # ── Nada se publica sin pasar las pruebas ──────────────────────────────────
  #
  # Antes no habia ningun trabajo de pruebas: el workflow solo construia y
  # publicaba. Las 750 pruebas de Python existian y ninguna bloqueaba una
  # release, asi que un binario roto se publicaba igual --- paso cuatro veces
  # seguidas con spglib. Esto es la puerta que faltaba.
  pruebas:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Dos cosas de `dependencies` no se pueden instalar aqui, y las dos
      # tumbaban el trabajo entero antes de correr una sola prueba:
      #
      #   * `perovskite-utils` es un repositorio PRIVADO. El runner no tiene
      #     credenciales, asi que `git clone` pide usuario y muere. Fallaban las
      #     DOS ramas del `||`, porque esta tanto en pyproject como en
      #     requirements.txt. La suite no la necesita:
      #     test_perovskite_utils_integration.py se salta si falta.
      #
      #   * `gpaw` se compila desde fuente y necesita libxc y BLAS. Los tests
      #     que lo usan se saltan sin el (test_migration.py), asi que instalarlo
      #     seria pagar una compilacion larga para no ejecutar nada mas.
      #
      # De ahi `--no-deps` mas la lista explicita: la misma que usa `build`, mas
      # las extras `web` que la API necesita y pytest. Escrita a mano y no
      # derivada del pyproject a proposito --- lo que se instala aqui tiene que
      # ser una decision visible, no un efecto secundario.
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install \
            "ase>=3.23" "spglib>=2.0" "numpy>=1.26" "pandas>=2.0" \
            "scipy>=1.12" "scikit-learn>=1.8,<1.9" "matplotlib>=3.8" \
            "pyyaml>=6.0" "click>=8.1" python-dotenv \
            "fastapi>=0.110" "uvicorn[standard]>=0.27" "httpx>=0.27" \
            "psutil>=5.9" "itsdangerous>=2.1" \
            pytest

      - name: pytest
        run: python -m pytest -q

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: flutter test
        working-directory: apps/dft_monitor_flutter
        run: |
          flutter pub get
          flutter test

  # ── El SPA se compila una sola vez y lo comparten las dos plataformas ───────
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: spa
          path: src/monitor_api/static/
          retention-days: 1

  build:
    needs: [version, frontend, pruebas]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            plataforma: linux-x86_64
            artefacto: tar.gz
          - os: windows-latest
            plataforma: windows-x64
            artefacto: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # El SPA compilado en el job anterior: idéntico en ambas plataformas.
      - uses: actions/download-artifact@v4
        with:
          name: spa
          path: src/monitor_api/static/

      - name: Instalar dependencias
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          fi
          python -m pip install --upgrade pip
          # Esta lista tiene que cubrir lo que el spec de PyInstaller necesita:
          # empaquetar no puede incluir lo que no esta instalado. spglib faltaba
          # y v0.7.0 salio sin el, con la identificacion de fase inservible
          # aunque `hiddenimports` lo declarara. Hay un test que compara esta
          # lista con el spec para que no vuelva a desincronizarse.
          #
          # scikit-learn acotado a 1.8.x: los models/*.pkl se serializaron con
          # esa versión y 1.9 no los despickliza.
          python -m pip install \
            "fastapi>=0.110" "uvicorn[standard]>=0.27" "httpx>=0.27" \
            "psutil>=5.9" "pyyaml>=6.0" "itsdangerous>=2.1" \
            "numpy>=1.26" "pandas>=2.0" "scipy>=1.12" "scikit-learn>=1.8,<1.9" \
            "ase>=3.23" "spglib>=2.0" pyinstaller python-dotenv

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Construir y probar
        shell: bash
        env:
          PYTHON: python
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          rm -f apps/dft_monitor_flutter/build apps/dft_monitor_flutter/.dart_tool
          bash scripts/build_web.sh --skip-npm
          bash scripts/build_desktop.sh
          if [ "$RUNNER_OS" = "Linux" ]; then
            bash scripts/package_linux_deb_from_release.sh "$VERSION"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dft-monitor-${{ matrix.plataforma }}
          path: |
            dist/*.${{ matrix.artefacto }}
            dist/*.deb
            dist/*.sha256
          retention-days: 7

  # ── Nada se publica sin que el propio paquete responda ─────────────────────
  #
  # El smoke test de `build_desktop.sh` corre sobre `dist/` ANTES de comprimir,
  # asi que todo lo que se rompe a partir de ahi --- o lo que ya estaba roto
  # dentro del bundle y el arranque no toca--- viajaba sin que nada lo mirase.
  # Cuatro versiones se publicaron sin spglib y una con la tabla de escala
  # ausente: en las cinco, el binario arrancaba perfectamente.
  #
  # Esto descarga el artefacto que se va a publicar, lo extrae como lo hara un
  # usuario, y le pregunta al binario por si mismo.
  humo:
    needs: [version, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            plataforma: linux-x86_64
          - os: windows-latest
            plataforma: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dft-monitor-${{ matrix.plataforma }}
          path: artefacto

      - name: Extraer el paquete
        shell: bash
        run: |
          mkdir -p humo
          cd artefacto
          for f in dft-monitor-desktop-*.tar.gz; do
            [ -f "$f" ] && tar xzf "$f" -C ../humo
          done
          for f in dft-monitor-desktop-*.zip; do
            [ -f "$f" ] && unzip -q "$f" -d ../humo
          done
          # `|| true`: el paso corre con `-e -o pipefail`, y `head` cierra la
          # tuberia en cuanto tiene sus 20 lineas --- `ls` muere con SIGPIPE y
          # tumbaba el trabajo por un listado informativo.
          ls -R ../humo | head -20 || true

      - name: El binario responde por si mismo
        shell: bash
        run: |
          MOTOR="$(find humo -type f \( -name dft-monitor-engine -o -name dft-monitor-engine.exe \) | head -1)"
          if [ -z "$MOTOR" ]; then
            echo "::error::no hay motor en el paquete publicado"; ls -R humo; exit 1
          fi
          chmod +x "$MOTOR" || true
          echo "motor: $MOTOR"

          # Sale 1 si falta cualquier cosa critica; el JSON dice cual.
          "$MOTOR" --autodiagnostico --data-root "$PWD/humo" | tee informe.json
          python -c "
          import json, sys
          d = json.load(open('informe.json', encoding='utf-8'))
          for aviso in d.get('avisos', []):
              print('::warning::' + aviso)
          if not d['ok']:
              for f in d['fallos']:
                  print('::error::' + f)
              sys.exit(1)
          c = d['comprobaciones']
          assert c['simetria']['numero'] == 221, c['simetria']
          assert c['tablas_calibracion']['escala']['disponible'], c['tablas_calibracion']
          assert c['tablas_calibracion']['scissor']['disponible'], c['tablas_calibracion']
          assert d['rutas']['frozen'], 'el motor publicado deberia estar congelado'
          print('paquete', d['version'], 'completo')
          "

      - name: Y arranca de verdad
        shell: bash
        run: |
          MOTOR="$(find humo -type f \( -name dft-monitor-engine -o -name dft-monitor-engine.exe \) | head -1)"
          mkdir -p humo-datos
          "$MOTOR" --engine --print-ready-json --port 0 --data-root "$PWD/humo-datos" > listo.jsonl 2>arranque.log &
          for _ in $(seq 1 90); do
            grep -q '"event": *"ready"' listo.jsonl 2>/dev/null && break
            sleep 1
          done
          cat arranque.log || true
          python -c "
          import json, sys, urllib.request
          linea = next((l for l in open('listo.jsonl', encoding='utf-8')
                        if l.strip().startswith('{')), None)
          if linea is None:
              sys.exit('el motor no llego a estar listo')
          base = json.loads(linea)['base_url']
          salud = json.loads(urllib.request.urlopen(base + '/api/health', timeout=30).read())
          assert 'version' in salud, salud
          print('salud:', salud['version'], '| ok:', salud.get('ok'))
          "

  publish:
    needs: [version, build, humo]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true

      - name: Reunir checksums
        shell: bash
        run: |
          cd artefactos
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: artefactos/*
          generate_release_notes: true
          body: |
            ## PEROVOWL DFT Monitor ${{ needs.version.outputs.version }}

            Interfaz gráfica del pipeline de cribado de perovskitas: genera candidatos,
            los criba con la cascada HTS, prepara y lanza cálculos DFT, y sigue el
            progreso en vivo.

            ### Descargar

            En **Assets**, descarga el archivo correspondiente a tu sistema:

            - Windows: `dft-monitor-desktop-${{ needs.version.outputs.version }}-windows-x64.zip`
            - Debian/Ubuntu: `perovowl-dft-monitor-${{ needs.version.outputs.version }}-linux-amd64.deb`
            - Linux portable: `dft-monitor-desktop-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz`
            - Linux web/servidor: `dft-monitor-web-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz`

            La aplicación de escritorio incluye el motor local congelado y no necesita
            Python, Node, Flutter ni clonar el repositorio para uso normal.

            ### Windows

            ```powershell
            Expand-Archive .\dft-monitor-desktop-${{ needs.version.outputs.version }}-windows-x64.zip
            .\dft-monitor-desktop-${{ needs.version.outputs.version }}-windows-x64\dft_monitor_flutter.exe
            ```

            Extrae el `.zip` en una **carpeta corta** (p. ej. `C:\perovowl`): el
            motor embebido anida rutas largas y el descompresor de Windows puede
            truncar archivos por el límite de 260 caracteres. Ejecuta
            `dft_monitor_flutter.exe` **desde dentro** de la carpeta extraída,
            con `engine\` al lado.

            Con eso ya puedes cribar y usar el predictor. Para **lanzar
            cálculos DFT** hace falta WSL: ver **Requisitos para correr DFT**
            más abajo.

            Si la app dice que no encuentra el motor, casi siempre es el
            antivirus: Windows Defender pone en cuarentena binarios sin firmar
            como `engine\dft-monitor-engine.exe`. Revisa
            *Seguridad de Windows → Protección antivirus → Historial* y
            restaura/permite el archivo. Como alternativa, en la pestaña
            **Diagnóstico** de la app puedes seleccionar el ejecutable del
            motor a mano.

            ### Debian/Ubuntu

            ```bash
            sudo apt install ./perovowl-dft-monitor-${{ needs.version.outputs.version }}-linux-amd64.deb
            perovowl-dft-monitor
            ```

            ### Linux portable

            ```bash
            tar xzf dft-monitor-desktop-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
            ./dft-monitor-desktop-${{ needs.version.outputs.version }}-linux-x86_64/dft_monitor_flutter
            ```

            ### Linux web/servidor

            ```bash
            tar xzf dft-monitor-web-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
            ./dft-monitor-web/dft-monitor-web --data-root /ruta/a/tus/datos
            ```

            Se abre en `http://127.0.0.1:8000`. Con `--host 0.0.0.0` se expone en
            la red y exige un token en `monitor.auth.token`.

            ### Requisitos para correr DFT

            Para **mirar el monitor, cribar candidatos y usar el predictor no hace
            falta nada**: el paquete trae el motor dentro. Lo de aquí abajo es solo
            para lanzar cálculos DFT.

            En **Windows**, GPAW no corre nativo: se ejecuta dentro de **WSL**. Hacen
            falta tres cosas, en este orden:

            | | Qué | ¿Lo hace la app? |
            |---|---|---|
            | 1 | **WSL** activado | **No.** Necesita administrador y reiniciar |
            | 2 | Una **distribución** (Ubuntu) | **No.** Pide usuario y contraseña de forma interactiva |
            | 3 | **GPAW** dentro de la distro | **Sí.** Lo instala el propio botón de arranque; y si ya está, lo encuentra sola |

            > `wsl.exe` existe en **todo** Windows 11 aunque WSL no esté instalado.
            > Que el comando responda no significa que lo tengas.

            **1. Activar WSL** — PowerShell **como administrador**, y **reiniciar**:

            ```powershell
            wsl --install
            ```

            **2. Instalar Ubuntu** (ya sin administrador) y abrirla una vez desde el
            menú Inicio para crear usuario y contraseña:

            ```powershell
            wsl --install -d Ubuntu
            wsl -l -v
            ```

            Ubuntu es la recomendada: es la que se prueba y la que asumen estos
            comandos.

            **3. GPAW**: abre la app y pulsa **Arrancar protocolo**. Si falta, el
            propio botón lo instala (~2.5 GB) y arranca el protocolo al terminar,
            sin que haya que volver a pulsarlo. Si ya está —aunque sea de otra
            instalación tuya— lo detecta y se configura sin preguntar.

            Para hacerlo a mano hay **dos sitios distintos** donde puedes estar, y
            los comandos no son los mismos: en **PowerShell** el prompt es
            `PS C:\Users\tu-nombre>`; **dentro de Ubuntu** es
            `tu-nombre@DESKTOP-XXXX:~$`. Dentro de Ubuntu no existe el comando
            `wsl` —ese es de Windows—, así que pegar ahí los de PowerShell da
            `wsl: command not found`.

            Desde **PowerShell**:

            ```powershell
            wsl -- bash -lc 'mkdir -p $HOME/perovowl-micromamba/bin && curl -Ls -o $HOME/perovowl-micromamba/bin/micromamba https://github.com/mamba-org/micromamba-releases/releases/latest/download/micromamba-linux-64 && chmod +x $HOME/perovowl-micromamba/bin/micromamba'
            wsl -- bash -lc '$HOME/perovowl-micromamba/bin/micromamba create -y -r $HOME/perovowl-micromamba -n gpaw246 -c conda-forge python=3.12 numpy=1.26 gpaw=24.6 ase openmpi'
            wsl -- bash -lc '$HOME/perovowl-micromamba/envs/gpaw246/bin/python -m gpaw --version'
            ```

            Comillas **simples** a propósito: PowerShell 5.1 destroza las dobles
            al pasarlas a un ejecutable nativo.

            Ya **dentro de Ubuntu**, lo mismo sin el envoltorio:

            ```bash
            mkdir -p $HOME/perovowl-micromamba/bin
            curl -Ls -o $HOME/perovowl-micromamba/bin/micromamba https://github.com/mamba-org/micromamba-releases/releases/latest/download/micromamba-linux-64
            chmod +x $HOME/perovowl-micromamba/bin/micromamba
            $HOME/perovowl-micromamba/bin/micromamba create -y -r $HOME/perovowl-micromamba -n gpaw246 -c conda-forge python=3.12 numpy=1.26 gpaw=24.6 ase openmpi
            $HOME/perovowl-micromamba/envs/gpaw246/bin/python -m gpaw --version
            ```

            El último debe responder `gpaw-24.6.0`.

            Cada cálculo DFT reserva ~2 GB de RAM. El arranque rápido mide la máquina
            y abre solo los trabajos que caben.

            En **Linux** no hay nada de WSL: GPAW corre nativo, en un entorno conda
            llamado `gpaw246` o el que apuntes con `BUHO_GPAW_PYTHON`.

            Comprueba la descarga con `sha256sum -c SHA256SUMS`.

            Incluye ASE (LGPL-2.1-or-later) dentro del binario.
