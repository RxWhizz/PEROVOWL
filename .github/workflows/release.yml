name: Release

# Los tags v* publican; workflow_dispatch permite ensayar el build completo sin
# crear ningún tag ni Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── La versión del código manda ─────────────────────────────────────────────
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.leer.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: leer
        shell: bash
        run: |
          VERSION="$(python3 -c "
          import re, pathlib
          texto = pathlib.Path('src/monitor_api/__init__.py').read_text()
          print(re.search(r'__version__ = \"([^\"]+)\"', texto).group(1))")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión del código: $VERSION"

          # Publicar un v0.3.0 que por dentro se llama 0.2.0 sería confuso para
          # siempre: mejor abortar aquí.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::El tag v$TAG no coincide con __version__ = $VERSION"
              exit 1
            fi
          fi

  # ── El SPA se compila una sola vez y lo comparten las dos plataformas ───────
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: spa
          path: src/monitor_api/static/
          retention-days: 1

  build:
    needs: [version, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            plataforma: linux-x86_64
            artefacto: tar.gz
          - os: windows-latest
            plataforma: windows-x64
            artefacto: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # El SPA compilado en el job anterior: idéntico en ambas plataformas.
      - uses: actions/download-artifact@v4
        with:
          name: spa
          path: src/monitor_api/static/

      - name: Instalar dependencias
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          fi
          python -m pip install --upgrade pip
          # Esta lista tiene que cubrir lo que el spec de PyInstaller necesita:
          # empaquetar no puede incluir lo que no esta instalado. spglib faltaba
          # y v0.7.0 salio sin el, con la identificacion de fase inservible
          # aunque `hiddenimports` lo declarara. Hay un test que compara esta
          # lista con el spec para que no vuelva a desincronizarse.
          #
          # scikit-learn acotado a 1.8.x: los models/*.pkl se serializaron con
          # esa versión y 1.9 no los despickliza.
          python -m pip install \
            "fastapi>=0.110" "uvicorn[standard]>=0.27" "httpx>=0.27" \
            "psutil>=5.9" "pyyaml>=6.0" "itsdangerous>=2.1" \
            "numpy>=1.26" "pandas>=2.0" "scipy>=1.12" "scikit-learn>=1.8,<1.9" \
            "ase>=3.23" "spglib>=2.0" pyinstaller python-dotenv

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Construir y probar
        shell: bash
        env:
          PYTHON: python
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          rm -f apps/dft_monitor_flutter/build apps/dft_monitor_flutter/.dart_tool
          bash scripts/build_web.sh --skip-npm
          bash scripts/build_desktop.sh
          if [ "$RUNNER_OS" = "Linux" ]; then
            bash scripts/package_linux_deb_from_release.sh "$VERSION"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dft-monitor-${{ matrix.plataforma }}
          path: |
            dist/*.${{ matrix.artefacto }}
            dist/*.deb
            dist/*.sha256
          retention-days: 7

  publish:
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true

      - name: Reunir checksums
        shell: bash
        run: |
          cd artefactos
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: artefactos/*
          generate_release_notes: true
          body: |
            ## PEROVOWL DFT Monitor ${{ needs.version.outputs.version }}

            Interfaz gráfica del pipeline de cribado de perovskitas: genera candidatos,
            los criba con la cascada HTS, prepara y lanza cálculos DFT, y sigue el
            progreso en vivo.

            ### Descargar

            En **Assets**, descarga el archivo correspondiente a tu sistema:

            - Windows: `dft-monitor-desktop-${{ needs.version.outputs.version }}-windows-x64.zip`
            - Debian/Ubuntu: `perovowl-dft-monitor-${{ needs.version.outputs.version }}-linux-amd64.deb`
            - Linux portable: `dft-monitor-desktop-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz`
            - Linux web/servidor: `dft-monitor-web-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz`

            La aplicación de escritorio incluye el motor local congelado y no necesita
            Python, Node, Flutter ni clonar el repositorio para uso normal.

            ### Windows

            ```powershell
            Expand-Archive .\dft-monitor-desktop-${{ needs.version.outputs.version }}-windows-x64.zip
            .\dft-monitor-desktop-${{ needs.version.outputs.version }}-windows-x64\dft_monitor_flutter.exe
            ```

            Extrae el `.zip` en una **carpeta corta** (p. ej. `C:\perovowl`): el
            motor embebido anida rutas largas y el descompresor de Windows puede
            truncar archivos por el límite de 260 caracteres. Ejecuta
            `dft_monitor_flutter.exe` **desde dentro** de la carpeta extraída,
            con `engine\` al lado.

            Si la app dice que no encuentra el motor, casi siempre es el
            antivirus: Windows Defender pone en cuarentena binarios sin firmar
            como `engine\dft-monitor-engine.exe`. Revisa
            *Seguridad de Windows → Protección antivirus → Historial* y
            restaura/permite el archivo. Como alternativa, en la pestaña
            **Diagnóstico** de la app puedes seleccionar el ejecutable del
            motor a mano.

            ### Debian/Ubuntu

            ```bash
            sudo apt install ./perovowl-dft-monitor-${{ needs.version.outputs.version }}-linux-amd64.deb
            perovowl-dft-monitor
            ```

            ### Linux portable

            ```bash
            tar xzf dft-monitor-desktop-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
            ./dft-monitor-desktop-${{ needs.version.outputs.version }}-linux-x86_64/dft_monitor_flutter
            ```

            ### Linux web/servidor

            ```bash
            tar xzf dft-monitor-web-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
            ./dft-monitor-web/dft-monitor-web --data-root /ruta/a/tus/datos
            ```

            Se abre en `http://127.0.0.1:8000`. Con `--host 0.0.0.0` se expone en
            la red y exige un token en `monitor.auth.token`.

            Comprueba la descarga con `sha256sum -c SHA256SUMS`.

            Incluye ASE (LGPL-2.1-or-later) dentro del binario.
